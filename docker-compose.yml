services:
  telegram-listener:
    build: .
    command: ["python", "-m", "dkcapital.telegram_listener"]
    env_file:
      - .env
    volumes:
      - dkcapital-data:/app/data
    restart: unless-stopped

  signal-processor:
    build: .
    command: ["python", "-m", "dkcapital.signal_processor"]
    env_file:
      - .env
    volumes:
      - dkcapital-data:/app/data
    restart: unless-stopped

  telegram-session:
    build: .
    command: ["python", "scripts/generate_telegram_session.py"]
    env_file:
      - .env
    stdin_open: true
    tty: true
    profiles:
      - tools

  telegram-dialogs:
    build: .
    command: ["python", "scripts/list_telegram_dialogs.py"]
    env_file:
      - .env
    profiles:
      - tools

  telegram-backfill:
    build: .
    command: ["python", "scripts/backfill_telegram_history.py", "--days", "30"]
    env_file:
      - .env
    volumes:
      - dkcapital-data:/app/data
    profiles:
      - tools

  discord-bot:
    build: .
    command: ["python", "-m", "dkcapital.discord_bot"]
    env_file:
      - .env
    volumes:
      - dkcapital-data:/app/data
    restart: unless-stopped
    profiles:
      - discord

volumes:
  dkcapital-data:

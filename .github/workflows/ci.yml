name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q src scripts tests windows

      - name: Validate boot recovery scripts
        run: |
          python -m py_compile ops/mt5/dkcapital-mt5-run ops/recovery/check_boot.py
          bash -n ops/recovery/install-recovery.sh
          bash -n scripts/stage_mt5_tp1_live.sh

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config -q
